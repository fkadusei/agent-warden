# The trust path: build, vet, the full test suite, and both attack gates.
name: go

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Pinned by version; Go's checksum database verifies what `go run` fetches.
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: Tests
        run: go test ./...

      # docs/design.html and docs/writeup.html are kept by hand beside their
      # Markdown. This also runs under `go test`; as its own step, a failure names
      # the heading, table cell, or decision where the two copies now disagree.
      - name: HTML docs match their Markdown
        run: go test -v -run 'TestHTMLMatchesMarkdown|TestTheCheckSeesTheDocs' ./internal/doccheck

      # The gates are the guarantee: a scripted, fully compromised agent must get
      # nothing through. They also run under `go test`, but a non-zero exit here names
      # the failing defence directly in the log.
      - name: Attack gates
        run: go run ./cmd/warden-gate

      - name: Race detector on the enforcement path
        run: go test -race ./internal/gateway ./internal/gate ./internal/mcpgw ./internal/store

      # Receipts are JWS: the chain ID lives inside the base64url payload, so the
      # command is taken from the demo's own output rather than reconstructed.
      - name: Demo produces a verifiable log
        run: |
          go run ./cmd/warden-demo | tee demo.out
          verify=$(grep -m1 -- '--log demo-output/receipts.jsonl' demo.out)
          echo "running: $verify"
          eval "$verify"

  # Every parser that reads bytes an attacker can control is fuzzed briefly on each
  # push (scripts/fuzz.sh). The seed inputs also run under the test job's
  # `go test`; this job looks for new ones.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Fuzz every untrusted-input parser
        run: FUZZTIME=30s scripts/fuzz.sh

      # A failing input is written under testdata/fuzz; print it, so the run's log
      # is enough to reproduce the finding.
      - name: Show failing inputs
        if: failure()
        run: |
          find . -path '*/testdata/fuzz/*' -type f | while read -r f; do
            echo "== $f"; cat "$f"; echo
          done

  # The whole history, not just the latest commit: the repository is public, so a
  # secret committed and later deleted is still published. .gitleaks.toml allows
  # exactly two values, both invented test credentials.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Scan every commit for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact --config .gitleaks.toml .

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
