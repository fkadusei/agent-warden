# Reproducible warden-verify binaries.
#
# Two independent builds, on Linux and on macOS, must produce byte-identical files.
# The publishing job builds a third time and compares its checksums with both before
# anything is released. Only the checksum lists move between jobs, so no artifact
# action is needed.
#
# A run started by hand (workflow_dispatch) is a dry run: it builds and compares,
# and publishes nothing. Pushing a tag named v* publishes a release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The exact toolchain. go.mod says only "go 1.27"; reproducing a release needs
  # this version, so every release names it.
  GO_VERSION: "1.27.3"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      sums: ${{ steps.build.outputs.sums }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - id: build
        run: |
          scripts/release-build.sh dist
          { echo 'sums<<END_OF_SUMS'; cat dist/SHA256SUMS; echo END_OF_SUMS; } >> "$GITHUB_OUTPUT"

  build-macos:
    runs-on: macos-latest
    outputs:
      sums: ${{ steps.build.outputs.sums }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - id: build
        run: |
          scripts/release-build.sh dist
          { echo 'sums<<END_OF_SUMS'; cat dist/SHA256SUMS; echo END_OF_SUMS; } >> "$GITHUB_OUTPUT"

  publish:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build a third time and require all three to match
        env:
          LINUX_SUMS: ${{ needs.build-linux.outputs.sums }}
          MACOS_SUMS: ${{ needs.build-macos.outputs.sums }}
        run: |
          scripts/release-build.sh dist
          diff <(printf '%s\n' "$LINUX_SUMS" | sed '/^$/d') <(sed '/^$/d' dist/SHA256SUMS)
          diff <(printf '%s\n' "$MACOS_SUMS" | sed '/^$/d') <(sed '/^$/d' dist/SHA256SUMS)
          echo "Builds on Linux, macOS, and this runner are byte-identical."

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "warden-verify, built from \`$GITHUB_SHA\` with Go $GO_VERSION."
            echo
            echo "These binaries are reproducible: builds on Linux and macOS produced identical"
            echo "files before this release was published. To check one yourself, check out this"
            echo "tag, install Go $GO_VERSION, run \`scripts/release-build.sh\`, and compare"
            echo "\`dist/SHA256SUMS\` with the one attached here. \`warden-verify -version\` names"
            echo "the commit and toolchain of any binary."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
