[project]
name = "warden-agent"
version = "0.1.0"
description = "Model-agnostic demo agent that reaches its tools only through Agent Warden"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "mcp==2.2.0",
    "anthropic==1.5.0",
    "openai==3.14.0",
]

[project.scripts]
warden-agent = "warden_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_agent"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]  # assert is how pytest checks

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["httpx2", "httpx2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
